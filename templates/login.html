
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Tuition Center Management System</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f4f6f8;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.10);
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h1 {
            color: #2c3e50;
            font-size: 25px;
            margin-bottom: 6px;
        }

        .login-header p {
            color: #6c757d;
            margin-top: 0;
        }

        .login-card label {
            display: block;
            font-weight: 600;
            margin: 15px 0 6px;
        }

        .login-card input,
        .login-card select {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            background: white;
            font-size: 15px;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-card button:hover {
            background: #0056b3;
        }

        .login-footer {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div class="login-card">

        <div class="login-header">
            <h1>Tuition Center</h1>
            <p>Management System</p>
            <h2>Welcome Back</h2>
            <p>Sign in to continue</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}" role="status">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="role">Login As</label>
            <select name="role" id="role" required>
                <option value="admin"
                    {% if selected_role == 'admin' %}selected{% endif %}>
                    Administrator
                </option>

                <option value="teacher"
                    {% if selected_role == 'teacher' %}selected{% endif %}>
                    Teacher
                </option>

                <option value="student"
                    {% if selected_role == 'student' %}selected{% endif %}>
                    Student
                </option>
            </select>

            <label for="username">Username</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Enter your username"
                   autocomplete="username"
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   autocomplete="current-password"
                   required>

            <button type="submit">Login</button>

        </form>

        <div class="login-footer">
            Secure access for administrators, teachers and students
        </div>

    </div>
</body>
</html>
